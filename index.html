<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Фабрика детских идей</title>

  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./mobile.css" />
</head>

<body>
  <!-- Blocks (Tilda-like) -->
  <header class="tBlock tHero" id="top">
    <div class="tHero__bg" aria-hidden="true"></div>
    <div class="tHero__grid" aria-hidden="true"></div>

    <!-- doodle overlays (hand-drawn) -->
    <div class="tDoodles" aria-hidden="true">
      <div class="doodle doodle--clouds">
        <svg viewBox="0 0 520 260" xmlns="http://www.w3.org/2000/svg" fill="none">
          <path d="M90 150c-26 0-46-18-46-40 0-22 20-40 46-40 9 0 18 2 25 6 8-22 31-38 58-38 30 0 55 19 61 45 5-2 11-3 17-3 25 0 45 17 45 38 0 21-20 38-45 38H90z"
                stroke="rgba(255,255,255,.85)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M280 190c-18 0-32-12-32-27 0-15 14-27 32-27 6 0 12 1 17 4 6-15 21-25 39-25 20 0 36 13 40 30 4-1 7-2 11-2 17 0 31 12 31 26 0 15-14 27-31 27H280z"
                stroke="rgba(255,255,255,.75)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M120 170v52" stroke="rgba(255,255,255,.65)" stroke-width="6" stroke-linecap="round"/>
          <path d="M150 170v60" stroke="rgba(255,255,255,.55)" stroke-width="6" stroke-linecap="round"/>
          <path d="M330 205v42" stroke="rgba(255,255,255,.50)" stroke-width="5" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="doodle doodle--rocket">
        <svg viewBox="0 0 420 260" xmlns="http://www.w3.org/2000/svg" fill="none">
          <path d="M250 40c-34 18-68 64-78 104-8 33-7 63-4 82 19-2 49-6 82-14 40-10 86-44 104-78-16-46-58-88-104-94z"
                stroke="rgba(255,255,255,.85)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M170 150l-46 46" stroke="rgba(255,255,255,.75)" stroke-width="7" stroke-linecap="round"/>
          <path d="M168 186l36 36" stroke="rgba(255,255,255,.65)" stroke-width="7" stroke-linecap="round"/>
          <circle cx="252" cy="120" r="22" stroke="rgba(255,255,255,.85)" stroke-width="7"/>
          <path d="M110 220c18-8 42-10 62-6-6 20-20 44-28 50-16 12-44 2-34-44z"
                stroke="rgba(255,255,255,.55)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M70 210c-10 18-10 44 12 58" stroke="rgba(255,255,255,.45)" stroke-width="6" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="doodle doodle--stars">
        <svg viewBox="0 0 520 220" xmlns="http://www.w3.org/2000/svg" fill="none">
          <path d="M78 70l10 22 24 3-18 16 5 24-21-12-21 12 5-24-18-16 24-3 10-22z"
                stroke="rgba(255,255,255,.70)" stroke-width="6" stroke-linejoin="round"/>
          <path d="M420 40l8 18 20 2-15 13 4 20-17-10-17 10 4-20-15-13 20-2 8-18z"
                stroke="rgba(255,255,255,.55)" stroke-width="5" stroke-linejoin="round"/>
          <path d="M270 110c0 20-16 36-36 36s-36-16-36-36 16-36 36-36"
                stroke="rgba(255,255,255,.28)" stroke-width="6" stroke-linecap="round"/>
          <path d="M285 75c12-10 28-16 46-16 38 0 69 26 69 58"
                stroke="rgba(255,255,255,.22)" stroke-width="6" stroke-linecap="round"/>
        </svg>
      </div>
    </div>


    <div class="tContainer">
      <div class="tTopbar">
        <div class="tBrand" data-brand></div>
        <nav class="tNav">
          <a class="tNav__link" href="#formats" data-scroll>форматы</a>
          <a class="tNav__link" href="#contacts" data-scroll>контакты</a>
        </nav>
      </div>

      <div class="tHero__content">
        <h1 class="tH1" data-hero-title></h1>
        <p class="tLead" data-hero-subtitle></p>

        <div class="tCtas">
          <a class="tBtn tBtn--primary" data-cta-primary href="#">Написать</a>
          <a class="tBtn tBtn--ghost" data-cta-secondary href="#">Портфолио</a>
        </div>
      </div>
    </div>

    <!-- decorative geometry -->
    <div class="tGeom" aria-hidden="true">
      <div class="g g1"></div>
      <div class="g g2"></div>
      <div class="tTape"></div>
      <div class="tSquiggle">
        <svg viewBox="0 0 260 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 78 C 44 30, 74 112, 108 58 C 140 10, 168 92, 200 40 C 222 14, 242 26, 250 40"
                stroke="rgba(250,227,111,.88)" stroke-width="7" stroke-linecap="round"/>
          <path d="M18 92 C 52 40, 84 124, 116 70 C 148 18, 176 104, 208 52 C 228 30, 246 38, 254 52"
                stroke="rgba(214,161,14,.74)" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </header>

  <main>
    <section class="tBlock tSplit" id="formats">
      <div class="tBand tBand--sun" aria-hidden="true"></div>
      <div class="tBand tBand--mint" aria-hidden="true"></div>
      <div class="tContainer">
        <div class="tSplit__head">
          <h2 class="tH2">Оффлайн / онлайн</h2>
          <p class="tSub">Два формата одной мастерской.</p>
        </div>

        <div class="tSplit__grid">
          <!-- LEFT -->
          <article class="tCard tCard--left">
            <div class="tTag" data-left-tag>Оффлайн</div>
            <h3 class="tH3" data-left-title></h3>
            <div class="tText" data-left-text></div>
          </article>

          <!-- RIGHT -->
          <article class="tCard tCard--right">
            <div class="tTag" data-right-tag>Онлайн</div>
            <h3 class="tH3" data-right-title></h3>
            <div class="tText" data-right-text></div>
          </article>
        </div>
      </div>
    </section>

    <section class="tBlock tContacts" id="contacts">
      <div class="tBand tBand--orange" aria-hidden="true"></div>
      <div class="tContainer">
        <div class="tContacts__card">
          <div class="tContacts__left">
            <h2 class="tH2" data-contacts-title></h2>
            <div class="tContacts__links">
              <a class="tLink" data-telegram href="#" target="_blank" rel="noopener">Telegram</a>
              <a class="tLink" data-portfolio href="#" target="_blank" rel="noopener">Портфолио</a>
            </div>
          </div>

          <div class="tContacts__right">
            <div class="tMini">
              <div class="tMini__label">Telegram</div>
              <div class="tMini__value" data-telegram-label></div>
            </div>
            <div class="tMini">
              <div class="tMini__label">Обо мне</div>
              <div class="tMini__value" data-portfolio-label></div>
            </div>
          </div>
        </div>

        <footer class="tFooter">
          <div class="tFooter__left" data-footer-left></div>
          <div class="tFooter__right">Редактирование: content.js</div>
        </footer>
      </div>
    </section>
  </main>

  <script type="module" src="./script.js"></script>
</body>
</html>
