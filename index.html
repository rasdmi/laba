<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Фабрика детских идей</title>

  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./mobile.css" />
</head>

<body>
  <!-- Blocks (Tilda-like) -->
  <header class="tBlock tHero" id="top">
    <div class="tHero__bg" aria-hidden="true"></div>
    <div class="tHero__grid" aria-hidden="true"></div>

    <div class="tContainer">
      <div class="tTopbar">
        <div class="tBrand" data-brand></div>
        <nav class="tNav">
          <a class="tNav__link" href="#formats" data-scroll>форматы</a>
          <a class="tNav__link" href="#contacts" data-scroll>контакты</a>
        </nav>
      </div>

      <div class="tHero__content">
        <h1 class="tH1" data-hero-title></h1>
        <p class="tLead" data-hero-subtitle></p>

        <div class="tCtas">
          <a class="tBtn tBtn--primary" data-cta-primary href="#">Написать</a>
          <a class="tBtn tBtn--ghost" data-cta-secondary href="#">Портфолио</a>
        </div>
      </div>
    </div>

    <!-- decorative geometry -->
    <div class="tGeom" aria-hidden="true">
      <div class="g g1"></div>
      <div class="g g2"></div>
      <div class="tTape"></div>
      <div class="tSquiggle">
        <svg viewBox="0 0 260 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 78 C 44 30, 74 112, 108 58 C 140 10, 168 92, 200 40 C 222 14, 242 26, 250 40"
                stroke="rgba(250,227,111,.88)" stroke-width="7" stroke-linecap="round"/>
          <path d="M18 92 C 52 40, 84 124, 116 70 C 148 18, 176 104, 208 52 C 228 30, 246 38, 254 52"
                stroke="rgba(214,161,14,.74)" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </header>

  <main>
    <section class="tBlock tSplit" id="formats">
      <div class="tContainer">
        <div class="tSplit__head">
          <h2 class="tH2">Оффлайн / онлайн</h2>
          <p class="tSub">Два формата одной мастерской.</p>
        </div>

        <div class="tSplit__grid">
          <!-- LEFT -->
          <article class="tCard tCard--left">
            <div class="tTag" data-left-tag>Оффлайн</div>
            <h3 class="tH3" data-left-title></h3>
            <div class="tText" data-left-text></div>
          </article>

          <!-- RIGHT -->
          <article class="tCard tCard--right">
            <div class="tTag" data-right-tag>Онлайн</div>
            <h3 class="tH3" data-right-title></h3>
            <div class="tText" data-right-text></div>
          </article>
        </div>
      </div>
    </section>

    <section class="tBlock tContacts" id="contacts">
      <div class="tContainer">
        <div class="tContacts__card">
          <div class="tContacts__left">
            <h2 class="tH2" data-contacts-title></h2>
            <div class="tContacts__links">
              <a class="tLink" data-telegram href="#" target="_blank" rel="noopener">Telegram</a>
              <a class="tLink" data-portfolio href="#" target="_blank" rel="noopener">Портфолио</a>
            </div>
          </div>

          <div class="tContacts__right">
            <div class="tMini">
              <div class="tMini__label">Telegram</div>
              <div class="tMini__value" data-telegram-label></div>
            </div>
            <div class="tMini">
              <div class="tMini__label">Обо мне</div>
              <div class="tMini__value" data-portfolio-label></div>
            </div>
          </div>
        </div>

        <footer class="tFooter">
          <div class="tFooter__left" data-footer-left></div>
          <div class="tFooter__right">Редактирование: content.js</div>
        </footer>
      </div>
    </section>
  </main>

  <script type="module" src="./script.js"></script>
</body>
</html>
