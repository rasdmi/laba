<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Фабрика детских вселенных — межпространственная мастерская</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./mobile.css" />
</head>
<body>
  <div class="hero" id="top">
    <div class="heroBg"></div>
    <div class="grid"></div>
    <div class="glow"></div>

    <div class="geom" aria-hidden="true">
      <div class="g g1"></div>
      <div class="g g2"></div>
      <div class="g g3"></div>
      <div class="tape"></div>
      <div class="squiggle">
        <svg viewBox="0 0 240 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 80 C 40 30, 70 110, 100 60 C 130 10, 160 90, 190 40 C 210 15, 225 25, 232 38"
                stroke="rgba(250,227,111,.85)" stroke-width="6" stroke-linecap="round"/>
          <path d="M18 92 C 48 42, 78 122, 108 72 C 138 22, 168 102, 198 52 C 214 30, 228 36, 236 48"
                stroke="rgba(214,161,14,.75)" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <div class="topbar">
      <div class="nav">
        <div class="brand">
          <b id="brandName">Фабрика детских вселенных</b>
          <span id="brandSub">межпространственная мастерская</span>
        </div>
        <div class="spacer"></div>
        <div class="navLinks">
          <a class="pill" href="#start" data-scroll>что это</a>
          <a class="pill primary" href="#start" data-scroll>как попасть</a>
        </div>
      </div>
    </div>

    <div class="shell">
      <div class="chips" id="chips"></div>

      <div class="hTitle" id="heroTitle"></div>
      <div class="hSub" id="heroSub"></div>
      <div class="lead" id="heroLead"></div>

      <div class="ctas">
        <a class="btn primary" href="#start" data-scroll id="ctaPrimary">Хочу в мастерскую</a>
        <a class="btn secondary" href="#how" data-scroll id="ctaSecondary">Как проходит</a>
      </div>

      <div class="blocks anchor" id="start">
        <div class="card"><div class="pad" id="blockLeft"></div></div>
        <div class="card"><div class="pad" id="blockRight"></div></div>
      </div>

      <div class="card anchor" id="how" style="margin-top:12px;">
        <div class="pad" id="blockHow"></div>
      </div>

      <div class="footer" style="margin-top:12px;">
        <div id="footerLeft"></div>
        <div><b id="footerRight"></b></div>
      </div>
    </div>
  </div>

  <script type="module" src="./script.js"></script>
</body>
</html>
